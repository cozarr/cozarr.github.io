<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        .buttons {
            margin-top: 20px;
            position: relative;
        }
        button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        #noButton {
            position: absolute;
        }
        #gifContainer {
            display: none;
            margin-top: 20px;
        }
        #message {
            display: none;
            font-size: 20px;
            font-weight: bold;
            color: red;
            margin-top: 20px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let yesButtonSize = 16;

        function respondYes() {
            confetti();
            document.getElementById("gifContainer").style.display = "block";
            document.getElementById("message").style.display = "block";
        }
        function respondNo() {
            yesButtonSize += 5;
            document.getElementById("yesButton").style.fontSize = yesButtonSize + "px";
            moveNoButton();
        }
        function moveNoButton() {
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 100);
            document.getElementById("noButton").style.left = x + "px";
            document.getElementById("noButton").style.top = y + "px";
        }
    </script>
</head>
<body>
    <p>Will you be my Valentine? <3</p>
    <img src="meandu.jpg" alt="Sample Image">
    <div class="buttons">
        <button id="yesButton" onclick="respondYes()">Yes</button>
        <button id="noButton" onclick="respondNo()">No</button>
    </div>
    <div id="message">Yay! ❤️</div>
    <div id="gifContainer">
        <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="Happy GIF">
    </div>
</body>
</html>
